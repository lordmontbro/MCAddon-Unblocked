<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Log in to My Addon World.">
  <title>Login | My Addon World</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #090909;
      --panel: #171414;
      --fire: #ed3434;
      --fire-bright: #ff5a3d;
      --text: #fff7f5;
      --muted: #baa9a6;
      --border: #432727;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 50% 20%, rgba(183, 28, 28, .2), transparent 55%), var(--black);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    header { border-bottom: 1px solid var(--border); background: rgba(9, 9, 9, .92); }
    .container { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 850; text-decoration: none; text-transform: uppercase; letter-spacing: .06em; }
    .brand img { width: 50px; height: 50px; object-fit: cover; border: 2px solid var(--fire); border-radius: 12px; }
    .nav-links { display: flex; gap: 18px; }
    .nav-links a { color: var(--muted); text-decoration: none; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--fire-bright); }
    main { min-height: calc(100vh - 77px); display: grid; place-items: center; padding: 48px 16px; }
    .auth-card { width: min(100%, 460px); padding: 32px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); box-shadow: 0 24px 80px rgba(0, 0, 0, .4); }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .intro, .notice { color: var(--muted); }
    .intro { margin: 0 0 24px; }
    .field { margin-bottom: 17px; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px; background: #0e0d0d; color: var(--text); font: inherit; }
    input:focus { outline: 3px solid var(--fire); outline-offset: 2px; }
    button { width: 100%; margin-top: 6px; padding: 12px; border: 1px solid var(--fire-bright); border-radius: 9px; background: linear-gradient(135deg, #c91f29, #8d151d); color: white; font: inherit; font-weight: 800; cursor: pointer; }
    button:hover { background: linear-gradient(135deg, var(--fire-bright), #c91f29); }
    .notice { margin: 18px 0 0; font-size: .88rem; }
    .switch { margin: 20px 0 0; color: var(--muted); text-align: center; }
    .switch a { color: var(--fire-bright); font-weight: 700; }
    @media (max-width: 520px) { .nav { min-height: 68px; } .brand span { display: none; } .nav-links { gap: 11px; font-size: .9rem; } .auth-card { padding: 25px 20px; } }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="index.html"><img src="avatar.png" alt=""><span>My Addon World</span></a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="login.html" aria-current="page">Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="servers.html">Servers</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-card" aria-labelledby="login-heading">
      <h1 id="login-heading">Welcome back</h1>
      <p class="intro">Log in to your account.</p>

      <!-- Configure this endpoint on a secure backend before enabling login. -->
      <form action="/api/auth/login" method="post">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Login</button>
      </form>

      <p class="notice">Login requires a secure server-side authentication service. This static page does not verify or store credentials.</p>
      <p class="switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
